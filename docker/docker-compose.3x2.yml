# Official 3x2 RustFS Jepsen topology (3 nodes x 2 drives = 6 drives, EC:3, R=3, W=4).

x-rustfs-node: &rustfs-node
  build:
    context: .
    dockerfile: Dockerfile
  cap_add:
    - NET_ADMIN
    - SYS_PTRACE
  environment:
    JEPSEN_SSH_PUBKEY: ${JEPSEN_SSH_PUBKEY:?Set JEPSEN_SSH_PUBKEY to your SSH public key}
    RUSTFS_DRIVES_PER_NODE: "2"
  mem_limit: 2g
  cpus: "1.0"
  networks:
    - jepsen-net

services:
  n1:
    <<: *rustfs-node
    container_name: rustfs-jepsen-n1
    hostname: n1
    volumes:
      - n1-data:/var/lib/rustfs

  n2:
    <<: *rustfs-node
    container_name: rustfs-jepsen-n2
    hostname: n2
    volumes:
      - n2-data:/var/lib/rustfs

  n3:
    <<: *rustfs-node
    container_name: rustfs-jepsen-n3
    hostname: n3
    volumes:
      - n3-data:/var/lib/rustfs

  control:
    build:
      context: ..
      dockerfile: docker/control.Dockerfile
    container_name: rustfs-jepsen-control
    hostname: control
    depends_on:
      - n1
      - n2
      - n3
    volumes:
      - ..:/jepsen
      - ${JEPSEN_SSH_KEY_DIR:-~/.ssh}:/root/.ssh:ro
    networks:
      - jepsen-net

networks:
  jepsen-net:
    driver: bridge

volumes:
  n1-data:
  n2-data:
  n3-data:
